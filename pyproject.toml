[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "poh-developer"
version = "0.1.0"
description = "Стадия «Разработка» контура производства: контракт прогона, разбор JUnit, круг правок, публикация рабочего дерева"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

# Правило: пакет не имеет права НАВЯЗЫВАТЬ версию. Он ставится в образ чужого
# воркера, и пин здесь означал бы конфликт с пином хозяина образа.
#
# Прежняя редакция говорила «зависимостей нет вовсе», и это было верно, пока
# стадия состояла из чистых модулей. Активности стадии — `@activity.defn`, то
# есть Temporal им нужен по существу, и формулировка стала неисполнимой.
#
# Нижняя граница, а не пин, — форма из `poh-delivery-agent`, подключённого к
# тому же харнессу: он объявляет `temporalio>=1.9`, харнесс пиннит
# `temporalio==1.9.0`, и выигрывает пин хозяина.
dependencies = [
    "temporalio>=1.9",
]

[project.optional-dependencies]
# Пин temporalio ЗДЕСЬ, а не в dependencies, и это не противоречие.
#
# `dependencies` объявляет нижнюю границу, чтобы пин хозяина образа выигрывал:
# харнесс ставит 1.9.0, и навязывать ему свою версию пакет права не имеет.
# Но собственный прогон тестов без пина берёт САМУЮ СВЕЖУЮ — CI разрешил >=1.9
# в 1.32.0, то есть пакет проверялся бы против API, которого в проде нет.
#
# Расхождение на 23 минорные версии заметить нечем: разойдётся оно молча, на
# живом прогоне стадии, а не здесь.
dev = [
    "pytest>=8",
    # Шаги стадии — корутины, и без плагина pytest их не запускает, а
    # ПРОПУСКАЕТ, засчитывая прогон зелёным. Отказ, который выглядит как успех,
    # поэтому плагин — обязательная зависимость прогона, а не удобство.
    "pytest-asyncio>=0.24",
    "temporalio==1.9.0",
]

[project.urls]
Homepage = "https://github.com/po-helper-org/poh-developer-agents"

[tool.setuptools.packages.find]
include = ["poh_developer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# `auto`, а не маркеры на каждой корутине: маркер, забытый на новом тесте, даёт
# молчаливый пропуск — тест числится в прогоне и ничего не проверяет.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
